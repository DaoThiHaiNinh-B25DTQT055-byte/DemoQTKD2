[project]
name = "minh-an-sales-agent"
version = "0.1.0"
description = "AI Agent xử lý yêu cầu báo giá, hồ sơ cơ hội và đề xuất kinh doanh cho Công ty Minh An"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "openpyxl>=3.1.5",
    "httpx>=0.27.2",
    "python-multipart>=0.0.12",
    "pydantic>=2.9.0",
    "google-genai>=1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

